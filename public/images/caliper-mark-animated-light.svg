<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg {
        /* Desaturated/darkened mint tone with low opacity */
        fill: #3b886d;
        fill-opacity: 0.15;
        rx: 75px;
      }
      .bar-element {
        /* Muted slate tone with low opacity */
        fill: #162b34;
        fill-opacity: 0.25;
      }

      /* Animated Elements */
      .dot-left {
        transform-origin: 137px 429px;
        animation: growDotLeft 1.8s ease-in-out infinite;
        animation-delay: 0s;
      }

      .bar-middle {
        transform-origin: 251px 429px;
        animation: barWave 1.8s ease-in-out infinite;
        animation-delay: 0.3s;
      }

      .bar-right-bottom {
        transform-origin: 364px 429px;
        animation: barWave 1.8s ease-in-out infinite;
        animation-delay: 0.6s;
      }

      .dot-right-top {
        animation: dotWave 1.8s ease-in-out infinite;
        animation-delay: 0.6s;
      }

      /* First Bar: Expands ~6.37x to match full height */
      @keyframes growDotLeft {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(6.37); }
        100% { transform: scaleY(1); }
      }

      /* General Bar Wave Animation */
      @keyframes barWave {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(0.25); }
        100% { transform: scaleY(1); }
      }

      /* Top Dot Offset */
      @keyframes dotWave {
        0% { transform: translateY(0); }
        50% { transform: translateY(190px); }
        100% { transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" />

  <!-- Animated Logo Bars -->
  <g id="bars">
    <rect class="bar-element dot-left" x="108" y="373" width="58" height="56" />
    <rect class="bar-element bar-middle" x="222" y="72" width="58" height="357" />
    <rect class="bar-element bar-right-bottom" x="335" y="173" width="58" height="256" />
    <rect class="bar-element dot-right-top" x="335" y="72" width="58" height="56" />
  </g>
</svg>
